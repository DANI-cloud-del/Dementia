services:
  - type: web
    name: silent-guardian
    runtime: python
    region: oregon  # or singapore for better India latency
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: GROQ_API_KEY
        sync: false  # Manual entry required
      - key: SECRET_KEY
        generateValue: true  # Auto-generate
      - key: FLASK_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
