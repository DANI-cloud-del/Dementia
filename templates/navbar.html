<script>
    // ============================================
// SILENT GUARDIAN - NAVIGATION JAVASCRIPT
// ============================================

// Dark Mode Toggle
const themeToggle = document.getElementById('themeToggle');
const body = document.body;

// Check for saved theme preference or default to 'light'
const currentTheme = localStorage.getItem('theme') || 'light';
if (currentTheme === 'dark') {
    body.classList.add('dark-mode');
}

// Toggle theme with animation
themeToggle.addEventListener('click', () => {
    body.classList.toggle('dark-mode');
    const theme = body.classList.contains('dark-mode') ? 'dark' : 'light';
    localStorage.setItem('theme', theme);
    
    // Optional: Add haptic feedback for mobile
    if (navigator.vibrate) {
        navigator.vibrate(50);
    }
});

// User Dropdown Menu
const userToggle = document.getElementById('userToggle');
const userDropdown = document.getElementById('userDropdown');

userToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    userDropdown.classList.toggle('active');
});

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
    if (!e.target.closest('.user-menu')) {
        userDropdown.classList.remove('active');
    }
});

// Mobile Menu Toggle
const mobileToggle = document.getElementById('mobileToggle');
const mobileNav = document.getElementById('mobileNav');

mobileToggle.addEventListener('click', () => {
    mobileToggle.classList.toggle('active');
    mobileNav.classList.toggle('active');
    
    // Prevent body scroll when mobile menu is open
    body.style.overflow = mobileNav.classList.contains('active') ? 'hidden' : '';
});

// Close mobile menu on link click
document.querySelectorAll('.mobile-nav-link').forEach(link => {
    link.addEventListener('click', () => {
        mobileToggle.classList.remove('active');
        mobileNav.classList.remove('active');
        body.style.overflow = '';
    });
});

// Close mobile menu when clicking outside
document.addEventListener('click', (e) => {
    if (!e.target.closest('.nav-container') && !e.target.closest('.mobile-nav')) {
        mobileToggle.classList.remove('active');
        mobileNav.classList.remove('active');
        body.style.overflow = '';
    }
});

// Active link highlighting
const currentPath = window.location.pathname;
document.querySelectorAll('.nav-link, .mobile-nav-link').forEach(link => {
    const linkPath = link.getAttribute('href');
    
    // Exact match for home page
    if (currentPath === '/' && linkPath === '/') {
        link.classList.add('active');
    } 
    // Match for other pages
    else if (currentPath !== '/' && linkPath !== '/' && currentPath.startsWith(linkPath)) {
        link.classList.add('active');
    }
});

// Smooth scroll behavior for in-page navigation
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
            target.scrollIntoView({
                behavior: 'smooth',
                block: 'start'
            });
        }
    });
});

// Navbar scroll effect (optional - adds shadow on scroll)
let lastScroll = 0;
const navbar = document.querySelector('.navbar');

window.addEventListener('scroll', () => {
    const currentScroll = window.pageYOffset;
    
    if (currentScroll > 10) {
        navbar.style.boxShadow = '0 4px 20px var(--shadow-hover)';
    } else {
        navbar.style.boxShadow = '0 2px 12px var(--shadow)';
    }
    
    lastScroll = currentScroll;
});

// Accessibility: Close dropdowns/menus on Escape key
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        userDropdown.classList.remove('active');
        
        if (mobileNav.classList.contains('active')) {
            mobileToggle.classList.remove('active');
            mobileNav.classList.remove('active');
            body.style.overflow = '';
        }
    }
});

// Optional: Add loading state indicator
window.addEventListener('beforeunload', () => {
    document.body.style.opacity = '0.6';
});

</script>
